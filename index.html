<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODD — Collection</title>
  <meta name="description" content="ODD — collection : ODD SNOWPANTS V2 et ODD JACKET V2.">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="./" aria-label="ODD — accueil">
      <img src="images/logo.png" alt="Logo ODD" width="256" height="256">
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="#collection">Collection</a>
    </nav>
  </header>

  <main id="collection" class="collection">
    <div class="collection-head">
      <h1>Collection</h1>
      <p class="count">2 articles</p>
    </div>

    <div class="grid">

      <article class="product" data-view="front">
        <button class="product-media" type="button" aria-label="Voir l'autre côté du ODD SNOWPANTS V2">
          <img class="front" src="images/pantalon-avant.jpg" alt="ODD SNOWPANTS V2 noir, vue de face" width="1000" height="1250">
          <img class="back" src="images/pantalon-arriere.jpg" alt="ODD SNOWPANTS V2 noir, vue de dos" width="1000" height="1250" loading="lazy">
        </button>
        <div class="product-info">
          <div>
            <h2>ODD SNOWPANTS&nbsp;V2</h2>
            <p class="meta">Noir</p>
            <p class="price">
              <s><span class="sr-only">Prix régulier :</span> 199,99 $</s>
              <span class="sale"><span class="sr-only">Prix réduit :</span> 179,99 $</span>
            </p>
          </div>
          <div class="views" role="group" aria-label="Choisir la vue">
            <button type="button" data-set="front" aria-pressed="true">Avant</button>
            <button type="button" data-set="back" aria-pressed="false">Arrière</button>
          </div>
        </div>
      </article>

      <article class="product" data-view="front">
        <button class="product-media" type="button" aria-label="Voir l'autre côté de la ODD JACKET V2">
          <img class="front" src="images/veste-avant.jpg" alt="ODD JACKET V2 noire à capuche, vue de face" width="1000" height="1250">
          <img class="back" src="images/veste-arriere.jpg" alt="ODD JACKET V2 noire à capuche, vue de dos" width="1000" height="1250" loading="lazy">
        </button>
        <div class="product-info">
          <div>
            <h2>ODD JACKET&nbsp;V2</h2>
            <p class="meta">Noir</p>
            <p class="price">
              <s><span class="sr-only">Prix régulier :</span> 189,99 $</s>
              <span class="sale"><span class="sr-only">Prix réduit :</span> 159,99 $</span>
            </p>
          </div>
          <div class="views" role="group" aria-label="Choisir la vue">
            <button type="button" data-set="front" aria-pressed="true">Avant</button>
            <button type="button" data-set="back" aria-pressed="false">Arrière</button>
          </div>
        </div>
      </article>

    </div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year">2026</span> ODD</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
